# Vhost temporal para validar ACME antes de emitir el certificado HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name soporte.stepsapp.cl;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://soporte.stepsapp.cl$request_uri; }
}
