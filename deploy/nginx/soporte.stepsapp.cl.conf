# Helpdesk de Karo Consultorías. La instancia Odoo sigue en 127.0.0.1:8069.
server {
    listen 80;
    listen [::]:80;
    server_name soporte.stepsapp.cl;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://soporte.stepsapp.cl$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name soporte.stepsapp.cl;

    ssl_certificate /etc/letsencrypt/live/soporte.stepsapp.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/soporte.stepsapp.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    client_max_body_size 200m;
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    location = / { return 302 /soporte; }
    location = /odoo { return 302 /odoo/helpdesk; }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_pass http://127.0.0.1:8069;
    }
}
