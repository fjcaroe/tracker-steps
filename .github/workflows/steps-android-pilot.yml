name: Steps Android pilot
on:
  push:
    branches: [codex/steps-android-pilot]
    paths: ['mobile/**', 'tools/android/**', '.github/workflows/steps-android-pilot.yml']
permissions:
  contents: read
concurrency:
  group: steps-android-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VITE_STEPS_API_BASE: https://desarrollo.stepsapp.cl/steps_app/v1
      STEPS_BUILD_NUMBER: ${{ github.run_number }}20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify client and prepare native pilot
        working-directory: mobile
        run: |
          npm ci
          npm test
          npm run build
          npm run android:pilot
      - name: Compile unsigned release packages and native tests
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease bundleRelease > "$RUNNER_TEMP/android-build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/android-build.log"; exit 1; }
          mkdir -p "$RUNNER_TEMP/android-tools"
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" "$RUNNER_TEMP/android-tools/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Steps-Android-pilot-${{ github.sha }}
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
            mobile/android/app/build/reports/tests/
            ${{ runner.temp }}/android-build.log
            ${{ runner.temp }}/android-tools/
          retention-days: 14
  android-installed:
    needs: android-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Steps-Android-pilot-${{ github.sha }}
          path: /tmp/steps-build
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install $(find /tmp/steps-build -name app-debug.apk)
            adb shell am start -W -n comm.stepsapp.mobile/cl.stepsapp.movil.MainActivity
            sleep 12
            adb shell pidof comm.stepsapp.mobile
            mkdir -p /tmp/steps-proof
            adb shell uiautomator dump /sdcard/steps-window.xml
            adb pull /sdcard/steps-window.xml /tmp/steps-proof/
            adb exec-out screencap -p > /tmp/steps-proof/login.png
            adb logcat -d -s AndroidRuntime Capacitor > /tmp/steps-proof/runtime.log
            ! grep -q 'FATAL EXCEPTION' /tmp/steps-proof/runtime.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Steps-Android-installed-proof-${{ github.sha }}
          path: /tmp/steps-proof/
          retention-days: 14
