name: Steps Android installed smoke
on:
  push:
    branches: [codex/steps-android-pilot]
    paths: ['.github/workflows/steps-android-smoke.yml']
permissions:
  contents: read
  actions: read
jobs:
  installed:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download exact pilot build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37957806572 --dir /tmp/steps-build
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install $(find /tmp/steps-build -name app-debug.apk)
            adb shell am start -W -n cl.stepsapp.movil/.MainActivity
            sleep 12
            adb shell pidof cl.stepsapp.movil
            mkdir -p /tmp/steps-proof
            adb shell uiautomator dump /sdcard/steps-window.xml
            adb pull /sdcard/steps-window.xml /tmp/steps-proof/
            adb exec-out screencap -p > /tmp/steps-proof/login.png
            adb logcat -d -s AndroidRuntime Capacitor > /tmp/steps-proof/runtime.log
            ! grep -q 'FATAL EXCEPTION' /tmp/steps-proof/runtime.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Steps-Android-installed-proof
          path: /tmp/steps-proof/
          retention-days: 14
